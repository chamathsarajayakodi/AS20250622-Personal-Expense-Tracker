<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Personal Expense Tracker</title>
        
        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
        
        <!-- Custom CSS -->
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Navigation bar -->
        <header class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#">Personal Expense Tracker</a>
            </div>
        </header>

        <!-- Main content -->
        <main class="container mt-4">

            <!-- Hero section -->
            <section class="container mt-4">
                <h1 class="text mb-4">Financial Dashboard</h1>
                <h2 class="text mb-4">Manage your income and expense in one place</h2>
            </section>

            <!-- Summary section -->
            <section class="container mt-4">
                <div class="row g-4">

                    <article class="col-md-4">
                        <div class="card text-center h-100 income-card">
                            <div class="card-body">
                                <h2 class="card-title">Total Income</h2>
                                <span id="totalIncomeCalculator">
                                    LKR 0.00
                                </span>
                            </div>
                        </div>
                    </article>

                    <article class="col-md-4">
                        <div class="card text-center h-100 expense-card">
                            <div class="card-body">
                                <h2 class="card-title">Total Expense</h2>
                                <span id="totalExpenseCalculator">
                                    LKR 0.00
                                </span>
                            </div>
                        </div>
                    </article>

                    <article class="col-md-4">
                        <div class="card text-center h-100 balance-card">
                            <div class="card-body">
                                <h2 class="card-title">Current Balance</h2>
                                <span id="balance">
                                    LKR 0.00
                                </span>
                            </div>
                        </div>
                    </article>

                </div>
            </section>

            <!-- Transaction section -->
            <section class="container mt-4">
                <div class="row">
                    <article class="col-12">
                        <div class="card text-start">
                            <div class="card-body">
                                <h2 class="card-title">Add a Transaction</h2>
                                <hr>
                                <div>
                                    <div class="mb-3">
                                        <label for="transactionType" class="form-label">
                                            Transaction Type
                                        </label>

                                        <select id="transactionType" class="form-select">
                                            <option value="" selected disabled>Choose Transaction Type</option>
                                            <option value="income">Income</option>
                                            <option value="expense">Expense</option>
                                        </select>
                                    </div>

                                    <!-- Error message -->
                                    <p id="typeErrorMessage" class="text-danger"></p>

                                    <div class="mb-3">
                                        <label>Description</label>
                                            <input 
                                                type="text"
                                                id="description"
                                                class="form-control"
                                                placeholder="eg: Monthly allowance">
                                    </div>

                                    
                                    <!-- Error message -->
                                    <p id="descriptionErrorMessage" class="text-danger"></p>
                                    
                                    <div class="mb-3">
                                        <label>Amount (LKR)</label>
                                        <input 
                                            type="number"
                                            id="transactionAmount"
                                            class="form-control"
                                            placeholder="Enter amount">
                                    </div>

                                    
                                    <!-- Error message -->
                                    <p id="amountErrorMessage" class="text-danger"></p>

                                    <div class="mb-3">
                                        <label for="transactionCategory" class="form-label">
                                            Category
                                        </label>

                                        <select id="transactionCategory" class="form-select">
                                            <option value="" selected disabled>Select a category</option>
                                            <option value="allowance">Allowance</option>
                                            <option value="salary">Salary</option>
                                            <option value="food">Food</option>
                                            <option value="transport">Transport</option>
                                            <option value="education">Education</option>
                                            <option value="entertainment">Entertainment</option>
                                            <option value="shopping">Shopping</option>
                                            <option value="bills">Bills</option>
                                            <option value="other">Other</option>
                                        </select>
                                    </div>

                                    <!-- Error message -->
                                    <p id="categoryErrorMessage" class="text-danger"></p>

                                    <div class="mb-3">
                                        <label for="transactionDate" class="form-label">
                                            Transaction Date
                                        </label>

                                        <input
                                            type="date"
                                            id="transactionDate"
                                            class="form-control">
                                    </div>

                                    <!-- Error message -->
                                    <p id="dateErrorMessage" class="text-danger"></p>

                                </div>
                                
                            </div>
                            <div class="d-flex gap-3 ms-3 mb-3">
                                <button
                                    class="btn btn-primary"
                                    id="addTransactionBtn">
                                    Add Transaction
                                </button>
                                <button
                                    class="btn btn-primary"
                                    id="clearFormBtn">
                                    Clear Form
                                </button>
                            </div>
                        </div>
                        
                    </article>
                </div>
            </section>

            <section>
                <div class="row">
                    <article class="col-12">
                        <div class="card text-start">
                            <div class="card-body">
                                <h2 class="card-title">Transaction History</h2>
                                <hr>
                                <div>
                                    <div class="mb-3">
                                        <label for="filterByType" class="form-label">
                                            Filter by Type
                                        </label>

                                        <select id="filterByType" class="form-select">
                                            <option value="all">All Transactions</option>
                                            <option value="income">Income</option>
                                            <option value="expense">Expense</option>
                                        </select>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="searchTransaction" class="form-label">
                                            Search Transaction
                                        </label>

                                        <select id="searchTransaction" class="form-select">
                                            <option value="" selected disabled>Choose search type</option>
                                            <option value="description">Description</option>
                                            <option value="category">Category</option>
                                        </select>

                                    </div>

                                    <!-- Description input -->
                                    <div id="descriptionSearch" class="mb-3 d-none">

                                        <label for="searchDescription" class="form-label">
                                            Enter Description
                                        </label>

                                        <input
                                            type="text"
                                            id="searchDescription"
                                            class="form-control"
                                            placeholder="Enter description">

                                    </div>

                                    <!-- Category selection -->
                                    <div id="categorySearch" class="mb-3 d-none">

                                        <label for="searchCategory" class="form-label">
                                            Select Category
                                        </label>

                                        <select id="searchCategory" class="form-select">
                                            <option value="" selected disabled>Select a category</option>
                                            <option value="allowance">Allowance</option>
                                            <option value="salary">Salary</option>
                                            <option value="food">Food</option>
                                            <option value="transport">Transport</option>
                                            <option value="education">Education</option>
                                            <option value="entertainment">Entertainment</option>
                                            <option value="shopping">Shopping</option>
                                            <option value="bills">Bills</option>
                                            <option value="other">Other</option>
                                        </select>

                                    </div>
                                    
                                </div>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-bordered table-hover">

                                    <thead>
                                        <tr>
                                            <th>Date</th>
                                            <th>Description</th>
                                            <th>Type</th>
                                            <th>Category</th>
                                            <th>Amount (LKR)</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>

                                    <tbody id="transactionList">
                                        <!-- Transactions will be displayed here -->
                                    </tbody>

                                </table>
                            </div>
                        </div>
                    </article>
                </div>
            </section>

        </main>

        <!-- JavaScript -->
        <script src="script.js"></script>

    </body>
